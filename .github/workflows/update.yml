name: update-dashboard

on:
  workflow_dispatch: {}
  schedule:
    # 平日 16:00 JST(=07:00 UTC) 大引け後に更新
    - cron: '0 7 * * 1-5'

concurrency:
  group: dashboard-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch master list (JPX)
        continue-on-error: true
        run: python scripts/fetch_master.py

      - name: Build sector strength (yfinance)
        continue-on-error: true
        run: python scripts/build_sector_strength.py

      - name: Render site
        continue-on-error: true
        run: python scripts/render_site.py

      - name: Screen stocks
        continue-on-error: true
        run: python scripts/screen_stocks.py

      - name: Render screening page
        continue-on-error: true
        run: python scripts/render_screening.py

      - name: Render stock detail page
        continue-on-error: true
        run: python scripts/render_stock_detail.py

      - name: Render watchlist page
        continue-on-error: true
        run: python scripts/render_watchlist.py

      - name: Build macro data (FX / US indices / commodities)
        continue-on-error: true
        run: python scripts/build_macro_data.py

      - name: Render overseas page
        continue-on-error: true
        run: python scripts/render_overseas.py

      - name: Render commodities page
        continue-on-error: true
        run: python scripts/render_commodities.py

      - name: Build Japan economy data (JGB yields / CGPI)
        continue-on-error: true
        run: python scripts/build_japan_economy.py

      - name: Render Japan economy page
        continue-on-error: true
        run: python scripts/render_japan_economy.py

      - name: Render portfolio allocation page
        continue-on-error: true
        run: python scripts/render_portfolio.py

      - name: Build calendar (BOJ / FOMC)
        continue-on-error: true
        run: python scripts/build_calendar.py

      - name: Render calendar page
        continue-on-error: true
        run: python scripts/render_calendar.py

      - name: Train prediction models (ML)
        continue-on-error: true
        run: python scripts/ml_predict.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'auto update dashboard'
          file_pattern: 'docs data'
